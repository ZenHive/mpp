# Deterministic Elixir CI gate for pushes and PRs.
# Invokes the `mix ci` (= `mix precommit.full`) alias directly so every push/PR
# gets format / compile / credo / doctor / sobelow / test+cover /
# clone-detection (ex_dna) / arch+smell (reach) / deps.audit / dialyzer /
# AGENTS.md-freshness evidence as PR checks, instead of needing a local
# reviewer to fetch the branch and run the suite. CI and local dev share one
# gate definition (mix.exs `aliases/0`) instead of a hand-maintained step list
# that can drift from it.
#
# Integration tests (`:integration` tag) are NOT run here — they need live
# Moderato/Stripe/Sepolia credentials and run in integration.yml. The repo's
# test/test_helper.exs already excludes `:integration` by default, so no
# `--exclude` flag is needed below.
#
# Versions come from `.tool-versions` (asdf format) via setup-beam — the same
# source the local toolchain reads — so CI and local never drift on `mix format`
# (Styler plugin) output.

name: CI

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    # No job-level MIX_ENV: like `mix precommit.full`, format/compile/credo/doctor/
    # sobelow run in :dev (so test/support/ — which lacks @spec on test helpers — is
    # NOT compiled and graded by Doctor). preferred_envs (cli/0) does NOT apply to
    # alias steps, so the test step sets MIX_ENV=test explicitly via `mix cmd env`
    # (see mix.exs `precommit`); dialyzer runs in :dev as it does locally.
    steps:
      - uses: actions/checkout@v7

      - id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      # _build holds the dialyzer PLT (plt_local_path/plt_core_path = _build/dialyzer),
      # so caching _build covers the slow cold-PLT build.
      - name: Cache deps & _build (covers dialyzer PLT)
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get

      # mix.exs `aliases/0` `ci: ["precommit.full"]` — see mix.exs for the
      # step list (precommit: format, compile, credo, doctor, test+cover,
      # sobelow; then ex_dna, reach.check, dialyzer.json, agents.check,
      # deps.audit.gated).
      - name: mix ci
        run: mix ci
