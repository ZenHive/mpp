# Cross-SDK conformance suite (`:cross_validation`).
#
# These tests answer the one question our own unit tests structurally cannot:
# does our wire format still match the reference SDKs? A hardcoded selector,
# RLP field index, or ABI signature that is wrong relative to the wire still
# passes every unit test, because the fixture builder encodes the SAME wrong
# assumption the golden test is supposed to catch. Only an independent
# implementation can break that tie — so these run our bytes through ox/tempo's
# TxEnvelopeTempo and assert our constants against viem/tempo and mppx source.
#
# They were excluded from `mix ci` on purpose: the gate must stay green on a
# cold offline checkout with no node_modules. That exclusion is correct, but it
# also meant they ran only when a human typed `--include cross_validation`
# locally — i.e. effectively never. This workflow is where they actually run.
#
# Needs NO repo secrets. Prerequisites the runner must supply, all of which
# exist on a dev machine but not on a fresh checkout:
#
#   * refs/mppx        — cloned here; gitignored locally (a session hook keeps
#                        it fresh). test/mpp/mcp_test.exs asserts against
#                        refs/mppx/src/server/Transport.ts and flunks loudly if
#                        it is absent, so the clone is load-bearing, not decor.
#   * ox + viem        — npm packages, pinned (see below).
#   * esbuild          — bundles ox/tempo into a QuickBEAM-loadable IIFE.
#                        Installed explicitly rather than left to `npx` to
#                        auto-fetch, so the run does not depend on npx's
#                        install prompt behaviour.
#   * QuickBEAM        — Elixir dep; ships precompiled via zigler_precompiled,
#                        so no Zig toolchain is required.
#
# Pinning split, deliberate: the npm packages are PINNED so a PR turning red
# means WE changed something, not that upstream published overnight. Detecting
# upstream drift is the `sdk-delta-watch` routine's job (it diffs the reference
# SDKs against a watermark in .sdk-watch.json and files tasks). refs/mppx is
# cloned at HEAD, matching how the local dev environment behaves.
#
# When bumping ox/viem here, bump the local root package.json too — it is
# gitignored, so the two cannot be kept in sync by tooling.
#
# This job is deliberately NOT a required status check: harness lands approved
# runs by ff-pushing straight to `main`, and a required check would block
# those pushes.

name: Cross-validation

on:
  schedule:
    - cron: "0 5 * * *" # nightly 05:00 UTC, an hour ahead of the integration suite
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cross-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-validation:
    name: Cross-validation
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7

      - id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps & _build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # Pinned to the versions the suite is verified against locally. ox carries
      # TxEnvelopeTempo (serialize/deserialize round-trip); viem carries the
      # Tempo ABIs and addresses our constants are checked against.
      - name: Install JS reference SDKs
        run: npm install --no-save ox@1.6.3 viem@2.55.18 esbuild@0.28.2

      # Gitignored locally and kept fresh by a session hook; CI has to fetch it.
      # Shallow: the tests read working-tree source, never history.
      - name: Clone mppx reference SDK
        run: git clone --depth 1 https://github.com/wevm/mppx.git refs/mppx

      - name: Compile
        run: mix compile

      # `--only` implies the include, and additionally excludes everything
      # untagged, so this runs the cross-validation suite and nothing else.
      # mix ci already covers the rest.
      # --no-retry: ex_unit_json auto-retries failures and reports a healed run as
      # `flaky` with exit 0. For wire-format conformance a heal IS the finding.
      - name: Cross-validation tests
        run: mix test.json --only cross_validation --no-retry
