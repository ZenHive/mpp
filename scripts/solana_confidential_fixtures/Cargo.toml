[package]
name = "mpp-solana-confidential-fixtures"
version = "0.1.0"
edition = "2021"
publish = false

# Dev-only fixture generator for the MPP Token-2022 confidential-bundle
# integration tests. NOT a dependency of the Elixir library — it only runs
# on an operator host that holds the funded devnet keypair.
#
# Dependency pinning follows solana-foundation/Confidential-Balances-Sample
# (https://github.com/solana-foundation/Confidential-Balances-Sample), which
# documents the 4.0 / 6.0.1 zk-sdk boundary: the deployed devnet ZK ElGamal
# Proof program expects 6.0.1-format proofs, while spl-token-2022 = 10.0.0
# still pulls zk-sdk 4.0 for its own public API.

[[bin]]
name = "mpp-solana-confidential-fixtures"
path = "src/main.rs"

[dependencies]
solana-sdk = "3.0.0"
solana-client = "3.1.6"
solana-zk-sdk = "6.0.1"
solana-system-interface = { version = "3.0.0", features = ["bincode"] }
solana-commitment-config = "3.1.0"
solana-address = "2.6"

spl-token-2022 = { version = "10.0.0", features = ["zk-ops"] }
spl-associated-token-account = "8.0.0"
spl-token-confidential-transfer-proof-extraction = "0.5.1"
spl-token-confidential-transfer-proof-generation = "0.6.0"
spl-record = { version = "0.4.0", features = ["no-entrypoint"] }

solana-zk-elgamal-proof-interface = "0.1.2"
solana-zk-sdk-pod = "0.1.1"

base64 = "0.22"
bs58 = "0.5"
bincode = "1.3"
bytemuck = "1.25"
serde_json = "1.0"
